description: Promote a commit to a tagged commit.

parameters:
  fingerprint:
    type: string
    description: SSH Key Fingerprint
    default: ""

  on_tag:
    type: string
    description: Command to execute if a new tag is created
    default: ":"

  on_skip:
    type: string
    description: Command to execute if no tag is created
    default: ":"

steps:
  - when:
      condition: << parameters.fingerprint >>
      steps:
        - add_ssh_keys:
            fingerprints:
              - "<< parameters.fingerprint >>"
  - run:
      name: Promote Tagged Build
      environment:
        ON_TAG: << parameters.on_tag >>
        ON_SKIP: << parameters.on_skip >>
      command: << include(scripts/tag_promote.sh) >>
